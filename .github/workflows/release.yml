# 发版：改好 src-tauri/tauri.conf.json 的 version 并提交后，打带说明的标签并推送
#   git tag -a v0.2.0 -m "更新说明（会显示在应用的升级弹窗里）"
#   git push origin v0.2.0
# 会在 Windows 和 macOS 上编译，生成草稿 Release（安装包 + 签名 + latest.json）。
# 在 GitHub 上检查无误后点 Publish，已安装的客户端才会检查到新版本（草稿不算 latest）。
#
# 需要的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           升级签名私钥文件的全部内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（生成时没设密码就不用建）
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 标签与版本号一致
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "标签 $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $v 不一致"; exit 1; }

      - name: 取标签说明作为更新说明
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "body<<__NOTES__"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: cc-remote-station ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
