<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="1024" height="1024" shape-rendering="crispEdges">
  <!-- 底板：右上/左下切角的暗色面板 + 青色描边。只留机器人本体，小尺寸下也干净 -->
  <path d="M0 0H16.5L20 3.5V20H3.5L0 16.5Z" fill="#120f26"/>
  <path d="M0.4 0.4H16.33L19.6 3.67V19.6H3.67L0.4 16.33Z" fill="none" stroke="#2de2ff" stroke-width="0.5" shape-rendering="geometricPrecision"/>
  <g transform="translate(2 2.5)">
    <!-- 天线 -->
    <rect x="6" y="0" width="4" height="1" fill="#2de2ff"/>
    <rect x="7" y="1" width="2" height="1" fill="#ff3d9a"/>
    <!-- 身体、手臂、四条腿 -->
    <g fill="#ff3d9a">
      <rect x="2" y="2" width="12" height="9"/>
      <rect x="0" y="5" width="2" height="3"/>
      <rect x="14" y="5" width="2" height="3"/>
      <rect x="3" y="11" width="2" height="3"/>
      <rect x="6" y="11" width="2" height="3"/>
      <rect x="9" y="11" width="2" height="3"/>
      <rect x="12" y="11" width="2" height="3"/>
    </g>
    <!-- 面罩与发光的眼睛 -->
    <rect x="3" y="4" width="10" height="3" fill="#0a0817"/>
    <rect x="4" y="5" width="3" height="1" fill="#2de2ff"/>
    <rect x="9" y="5" width="3" height="1" fill="#2de2ff"/>
    <!-- 胸口提示符 -->
    <rect x="4" y="8" width="3" height="1" fill="#ffc14d"/>
  </g>
</svg>
