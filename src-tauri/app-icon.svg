<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1024" height="1024" shape-rendering="crispEdges">
  <!-- 底板：右上/左下切角的暗色面板，青色描边 -->
  <path d="M0 0H20L24 4V24H4L0 20Z" fill="#120f26"/>
  <path d="M0.5 0.5H19.8L23.5 4.2V23.5H4.2L0.5 19.8Z" fill="none" stroke="#2de2ff" stroke-width="0.5" shape-rendering="geometricPrecision"/>
  <!-- 扫描线 -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="1" y="5" width="22" height="0.5"/><rect x="1" y="11" width="22" height="0.5"/><rect x="1" y="17" width="22" height="0.5"/>
  </g>
  <!-- 色差重影（青），向右偏半格 -->
  <g fill="#2de2ff" opacity="0.55">
    <rect x="6.5" y="6" width="12" height="9"/>
    <rect x="18.5" y="9" width="2" height="3"/>
  </g>
  <!-- 天线 -->
  <rect x="11" y="4" width="2" height="2" fill="#ff3d9a"/>
  <rect x="10" y="2.5" width="4" height="1.5" fill="#2de2ff"/>
  <!-- 身体与手臂 -->
  <g fill="#ff3d9a">
    <rect x="6" y="6" width="12" height="9"/>
    <rect x="4" y="9" width="2" height="3"/>
    <rect x="18" y="9" width="2" height="3"/>
    <!-- 四条腿 -->
    <rect x="7" y="15" width="1.5" height="3"/>
    <rect x="9.5" y="15" width="1.5" height="3"/>
    <rect x="13" y="15" width="1.5" height="3"/>
    <rect x="15.5" y="15" width="1.5" height="3"/>
  </g>
  <!-- 面罩与发光的眼睛 -->
  <rect x="7" y="8" width="10" height="3.5" fill="#0a0817"/>
  <rect x="8" y="9" width="2.5" height="1.5" fill="#2de2ff"/>
  <rect x="13.5" y="9" width="2.5" height="1.5" fill="#2de2ff"/>
  <!-- 胸口提示符 -->
  <rect x="8" y="12.5" width="1" height="1" fill="#0a0817"/>
  <rect x="9.5" y="12.5" width="2.5" height="1" fill="#ffc14d"/>
  <!-- 故障切片 -->
  <rect x="3" y="13" width="3" height="0.75" fill="#2de2ff"/>
  <rect x="18" y="6.5" width="2.5" height="0.75" fill="#ff3d9a"/>
  <!-- 地面线 -->
  <rect x="5" y="19" width="14" height="0.5" fill="#2de2ff" opacity="0.6"/>
</svg>
