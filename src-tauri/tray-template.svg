<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="1024" height="1024" shape-rendering="crispEdges">
  <!-- macOS 菜单栏模板图：系统只看透明度、自己着色。面罩挖空，眼睛和胸口保留，和彩色版是同一个机器人 -->
  <defs>
    <mask id="face">
      <rect width="16" height="16" fill="#fff"/>
      <g transform="translate(0 1)" fill="#000">
        <rect x="3" y="4" width="10" height="3"/>
        <rect x="4" y="8" width="3" height="1"/>
      </g>
      <g transform="translate(0 1)" fill="#fff">
        <rect x="4" y="5" width="3" height="1"/>
        <rect x="9" y="5" width="3" height="1"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(0 1)" fill="#000" mask="url(#face)">
    <rect x="6" y="0" width="4" height="1"/>
    <rect x="7" y="1" width="2" height="1"/>
    <rect x="2" y="2" width="12" height="9"/>
    <rect x="0" y="5" width="2" height="3"/>
    <rect x="14" y="5" width="2" height="3"/>
    <rect x="3" y="11" width="2" height="3"/>
    <rect x="6" y="11" width="2" height="3"/>
    <rect x="9" y="11" width="2" height="3"/>
    <rect x="12" y="11" width="2" height="3"/>
  </g>
</svg>
