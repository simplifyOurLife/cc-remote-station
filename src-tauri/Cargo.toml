[package]
name = "cc-workstation"
version = "0.1.0"
description = "SSH workstation tuned for remote Claude Code"
authors = ["cc-workstation"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_workstation_lib"
# 只做桌面端：不生成 cdylib/staticlib（移动端才需要）。GNU ld 链接 cdylib 会因导出符号超 65535 报 "export ordinal too large"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ring 替代默认的 aws-lc-rs：Windows 上无需 cmake/NASM，编译快、体积小
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "process", "fs"] }
anyhow = "1.0.104"
dirs = "7.0.0"
log = "0.4.35"
env_logger = "0.11.11"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
uuid = { version = "1.29.2", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
png = "0.18.1"
axum = "0.8.9"
dunce = "1.0.5"
encoding_rs = "0.8.44"
ignore = "0.4.34"
globset = "0.4.21"
regex = "1.13.1"
tauri-plugin-dialog = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
base64 = "0.23.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
